name: Test Surge Modules

on:
  push:
    branches: [main]
    paths: ['Rewrite/**', 'Tools/**', '.github/workflows/test-surge-modules.yml']
  pull_request:
    paths: ['Rewrite/**', 'Tools/**', '.github/workflows/test-surge-modules.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-surge-modules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check generated bundles
        run: |
          node Rewrite/Youtube/build-prewarm.cjs --check
          node Rewrite/Youtube/build-lyrics-chinese.cjs --check
      - name: Run offline regressions
        run: |
          node --test Tools/Testing/module-contracts.test.cjs Tools/NetworkInfo/network-info.test.cjs Tools/NodeOfflineMonitor/node-offline-monitor.test.cjs Tools/NodeOfflineMonitor/node-budgets.test.cjs Tools/CTMUsage/ctm-usage.test.cjs Tools/Rewrite/*.test.mjs Tools/Advertising/update-advertising-module.test.mjs Tools/Filters/update-imported-filters.test.mjs Rewrite/GeneralAdBlock/general-safety.test.cjs Rewrite/Bilibili/*.test.cjs Rewrite/Youtube/youtube-prewarm.test.cjs Rewrite/Youtube/youtube-prewarm-init.test.cjs Rewrite/Youtube/youtube-song-cache.test.cjs Rewrite/Youtube/youtube-module-safety.test.cjs
          node Rewrite/Youtube/youtube-caption-queue.test.cjs
          node Rewrite/Youtube/youtube-lyrics-order.test.cjs
          git diff --exit-code
