name: Test Surge Modules

on:
  push:
    branches: [main]
    paths: ['Rewrite/**', 'Tools/**', 'Automation/**', '.github/workflows/test-surge-modules.yml']
  pull_request:
    paths: ['Rewrite/**', 'Tools/**', 'Automation/**', '.github/workflows/test-surge-modules.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-surge-modules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check generated bundles
        run: |
          node Rewrite/Youtube/tools/build-prewarm.cjs --check
          node Rewrite/Youtube/tools/build-lyrics-chinese.cjs --check
      - name: Run offline regressions
        run: |
          node --test Automation/Testing/tests/module-contracts.test.cjs Tools/NetworkInfo/tests/network-info.test.cjs Tools/NodeOfflineMonitor/tests/node-offline-monitor.test.cjs Tools/NodeOfflineMonitor/tests/node-budgets.test.cjs Tools/CTMUsage/tests/ctm-usage.test.cjs Automation/Rewrite/tests/*.test.mjs Automation/Advertising/tests/update-advertising-module.test.mjs Automation/Filters/tests/update-imported-filters.test.mjs Rewrite/GeneralAdBlock/tests/general-safety.test.cjs Rewrite/Bilibili/tests/*.test.cjs Rewrite/Youtube/tests/youtube-prewarm.test.cjs Rewrite/Youtube/tests/youtube-prewarm-init.test.cjs Rewrite/Youtube/tests/youtube-song-cache.test.cjs Rewrite/Youtube/tests/youtube-module-safety.test.cjs
          node Rewrite/Youtube/tests/youtube-caption-queue.test.cjs
          node Rewrite/Youtube/tests/youtube-lyrics-order.test.cjs
          git diff --exit-code
